<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08080C"/>
      <stop offset="0.5" stop-color="#312e81"/>
      <stop offset="1" stop-color="#0a0a14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <rect width="400" height="250" fill="url(#bg)"/>

  <!-- Product frame -->
  <rect x="140" y="50" width="120" height="140" rx="16" fill="#16162a" stroke="#6366F1" stroke-opacity="0.4" stroke-width="2"/>
  <rect x="155" y="70" width="90" height="60" rx="8" fill="url(#accent)" opacity="0.85"/>
  <rect x="155" y="142" width="90" height="10" rx="5" fill="#ffffff" opacity="0.7"/>
  <rect x="155" y="160" width="60" height="10" rx="5" fill="#ffffff" opacity="0.4"/>

  <!-- Brand text -->
  <text x="200" y="220" text-anchor="middle" fill="#A5B4FC" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="3">CINEMATIC</text>
  <text x="200" y="237" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="600" letter-spacing="1">PRODUCT SHOWCASE</text>
</svg>
