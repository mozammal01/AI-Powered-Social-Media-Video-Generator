<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#07111F"/>
      <stop offset="1" stop-color="#0B1930"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>

  <rect width="400" height="250" fill="url(#bg)"/>

  <!-- Grid lines -->
  <line x1="60" y1="50" x2="60" y2="200" stroke="#38BDF8" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="120" y1="50" x2="120" y2="200" stroke="#38BDF8" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="180" y1="50" x2="180" y2="200" stroke="#38BDF8" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="240" y1="50" x2="240" y2="200" stroke="#38BDF8" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="300" y1="50" x2="300" y2="200" stroke="#38BDF8" stroke-opacity="0.15" stroke-width="1"/>
  <line x1="360" y1="50" x2="360" y2="200" stroke="#38BDF8" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Chart line -->
  <polyline points="60,180 120,160 180,140 240,120 300,90 360,70" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Stat number -->
  <text x="200" y="55" text-anchor="middle" fill="#F8FAFC" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="800">78%</text>

  <!-- Label -->
  <text x="200" y="230" text-anchor="middle" fill="#38BDF8" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" letter-spacing="2">DATA STATISTICS</text>
</svg>
