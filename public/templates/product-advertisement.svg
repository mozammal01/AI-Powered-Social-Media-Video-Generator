<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0f1a"/>
      <stop offset="0.45" stop-color="#312e81"/>
      <stop offset="0.75" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#0a0a14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#6366F1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- Phone frame -->
  <rect x="330" y="60" width="140" height="380" rx="24" fill="#16162a" stroke="#6366F1" stroke-opacity="0.5" stroke-width="2"/>
  <rect x="344" y="86" width="112" height="70" rx="8" fill="url(#accent)" opacity="0.85"/>
  <rect x="344" y="170" width="112" height="12" rx="6" fill="#ffffff" opacity="0.75"/>
  <rect x="344" y="192" width="80" height="12" rx="6" fill="#ffffff" opacity="0.4"/>
  <rect x="344" y="226" width="112" height="56" rx="8" fill="#ffffff" opacity="0.08"/>
  <rect x="344" y="292" width="112" height="56" rx="8" fill="#ffffff" opacity="0.08"/>
  <rect x="344" y="366" width="112" height="40" rx="20" fill="url(#accent)"/>
  <text x="400" y="391" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">SHOP NOW</text>

  <!-- Left copy block -->
  <text x="70" y="180" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="4" fill="#A5B4FC">PRODUCT AD</text>
  <text x="70" y="225" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#ffffff">Launch.</text>
  <text x="70" y="272" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#ffffff">Showcase.</text>
  <text x="70" y="319" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="url(#accent)">Convert.</text>
  <rect x="72" y="345" width="150" height="4" rx="2" fill="url(#accent)"/>

  <!-- Scene dots -->
  <circle cx="70" cy="420" r="7" fill="#6366F1"/>
  <circle cx="94" cy="420" r="7" fill="#6366F1" opacity="0.55"/>
  <circle cx="118" cy="420" r="7" fill="#6366F1" opacity="0.35"/>
  <circle cx="142" cy="420" r="7" fill="#6366F1" opacity="0.2"/>
  <circle cx="166" cy="420" r="7" fill="#6366F1" opacity="0.1"/>
</svg>