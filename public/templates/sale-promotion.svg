<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0714"/>
      <stop offset="0.5" stop-color="#831843"/>
      <stop offset="0.8" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#160511"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EC4899"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#EC4899" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#glow)"/>

  <!-- Diagonal energy stripes -->
  <rect x="-80" y="330" width="1000" height="26" fill="url(#accent)" opacity="0.18" transform="rotate(-8 400 340)"/>
  <rect x="-80" y="380" width="1000" height="14" fill="url(#accent)" opacity="0.12" transform="rotate(-8 400 380)"/>

  <!-- Discount burst -->
  <g transform="translate(585 165)">
    <path d="M0 -95 L22 -60 L62 -78 L64 -34 L108 -28 L86 10 L118 42 L74 62 L82 106 L38 96 L20 138 L-14 108 L-52 132 L-62 88 L-108 84 L-92 44 L-124 12 L-84 -12 L-98 -54 L-54 -56 L-48 -100 L-10 -80 Z"
          fill="url(#accent)" stroke="#ffffff" stroke-opacity="0.25" stroke-width="3"/>
    <text x="0" y="8" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle">50%</text>
    <text x="0" y="40" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" letter-spacing="3" fill="#ffffff" text-anchor="middle">OFF</text>
  </g>

  <!-- Left copy block -->
  <text x="70" y="140" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" letter-spacing="4" fill="#FBCFE8">FLASH SALE</text>
  <text x="70" y="215" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="900" fill="url(#accent)">MEGA</text>
  <text x="70" y="290" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="900" fill="#ffffff">SALE</text>

  <!-- Price slash -->
  <text x="70" y="360" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" fill="#ffffff" opacity="0.45">$199</text>
  <line x1="66" y1="350" x2="130" y2="366" stroke="#F97316" stroke-width="5" stroke-linecap="round"/>
  <text x="146" y="362" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="900" fill="#ffffff">$99</text>

  <!-- CTA pill -->
  <rect x="70" y="404" width="200" height="46" rx="23" fill="url(#accent)"/>
  <text x="170" y="433" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">SHOP THE SALE</text>
</svg>